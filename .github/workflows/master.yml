name: Release (Github Package Registry)

on:
  pull_request:
    types:
      - closed
    branches:
      - 'master'
    paths-ignore:
      - '.github/dependabot.yml'

env:
  IMAGE: ghcr.io/${{ github.repository }}/simple-slack-poster:${{ github.sha }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      packages: write
    if: github.event.pull_request.merged == true
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        name: Checkout
      - name: Setup Java 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: 25
          distribution: temurin
      - id: bump
        uses: zwaldowski/match-label-action@v6
        with:
          allowed: major,minor,patch
      - id: next_version
        uses: zwaldowski/semver-release-action@v6
        name: Prepare and tag release with semver
        with:
          bump: ${{ steps.bump.outputs.match }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: upload artifact
        run: ./gradlew -Pversion="$(echo ${{steps.next_version.outputs.version_tag}})" publish
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: v${{steps.next_version.outputs.version_tag}}